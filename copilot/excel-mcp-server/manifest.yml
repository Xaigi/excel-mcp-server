# Excel MCP Server — Backend Service in the mimasa-ai Copilot app.
# Reachable inside the cluster at:
#   http://excel-mcp-server.${COPILOT_SERVICE_DISCOVERY_ENDPOINT}:8017/mcp
# Not publicly exposed.
#
# Spec: https://aws.github.io/copilot-cli/docs/manifest/backend-service/

name: excel-mcp-server
type: Backend Service

image:
  build:
    dockerfile: Dockerfile
    context: .
  port: 8017
  healthcheck:
    # openpyxl is pure-Python and the MCP endpoint is /mcp; a simple TCP-level
    # check via python avoids adding curl to the slim image.
    command: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8017)); sys.exit(0)\" || exit 1"]
    interval: 30s
    retries: 3
    timeout: 5s
    start_period: 20s

cpu: 512
memory: 1024
platform: linux/arm64  # Fargate Graviton — matches Apple Silicon build, cheaper than x86_64
count: 1
exec: true

network:
  connect: true

variables:
  EXCEL_FILES_PATH: /data/excel_files
  FASTMCP_HOST: 0.0.0.0
  FASTMCP_PORT: "8017"
  # Remote-workbook (presigned-URL) fetch config — see src/excel_mcp/remote_workbook.py.
  # ALLOWED_URL_HOSTS is an SSRF allowlist; default here matches simstudio's dev
  # S3 bucket, overridden per-env below for production.
  EXCEL_MCP_ALLOWED_URL_HOSTS: mimasa-workflows-local-dev.s3.ap-south-1.amazonaws.com
  EXCEL_MCP_MAX_FILE_BYTES: "104857600"       # 100 MiB
  EXCEL_MCP_REQUEST_TIMEOUT_SECONDS: "120"

storage:
  volumes:
    excel-data:
      path: /data/excel_files
      read_only: false
      efs: true

environments:
  production:
    count: 1
    variables:
      # Same bucket the simstudio prod service writes to (S3_BUCKET_NAME).
      EXCEL_MCP_ALLOWED_URL_HOSTS: mimasa-ai-workflow-prod.s3.ap-south-1.amazonaws.com
